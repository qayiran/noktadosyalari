#!/usr/bin/nft -f
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # Loopback ve kurulu bağlantılara izin vër
        iifname "lo" accept
        ct state vmap { established : accept, related : accept, invalid : drop }

        # ICMP / Ping ve IPv6 Komşu Keşfi
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # Plex Web (Sadece ev ağı: 192.168.x.x)
        ip saddr 192.168.0.0/16 tcp dport 32400 accept

        # Hotspot (ap0) DHCP ve DNS isteklerine izin vër
        iifname "ap*" udp dport { 53, 67, 5353 } accept
        iifname "ap*" tcp dport { 53, 5353 } accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        # Hotspot (ap0) internet paylaşımına izin vër
        iifname "ap*" accept
        oifname "ap*" ct state established,related accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
