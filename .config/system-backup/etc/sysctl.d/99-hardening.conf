# --- Network Hardening ---
# Ignore all ICMP echoes (optional, makes you "invisible" to pings)
# net.ipv4.icmp_echo_ignore_all = 1

# Disable Source Routing (prevents malicious packet routing)
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Enable Reverse Path Filtering (prevents IP spoofing)
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# --- System Hardening ---
# Prevent core dumps for setuid programs (prevents memory leaks of sensitive data)
fs.suid_dumpable = 0

# Restrict BPF JIT compiler to root (mitigates some kernel exploits)
net.core.bpf_jit_harden = 2
