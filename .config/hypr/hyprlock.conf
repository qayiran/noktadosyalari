# ------------------------
# ---- GENËL AYARLAR ----
# ------------------------

general {
    hide_cursor = true
    ignore_empty_input = true
}

# ---------------------
# ---- ARKA PLAN ----
# ---------------------

background {
    monitor =
    path = $HOME/sitelen sinpin/taskimaidenv2.jpg
    blur_passes = 2
    blur_size = 5
    brightness = 0.7
}

# ---------------
# ---- SAAT ----
# ---------------

label {
    monitor =
    text = $TIME
    color = rgba(224, 224, 224, 1.0)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 120
    halign = center
    valign = center
}

# -----------------------
# ---- ŞİFRE GİRİŞİ ----
# -----------------------

input-field {
    monitor =
    size = 280, 55
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(210, 61, 80, 1.0)
    inner_color = rgba(26, 26, 26, 0.85)
    font_color = rgba(224, 224, 224, 1.0)
    check_color = rgba(214, 162, 89, 1.0)
    fail_color = rgba(210, 61, 80, 1.0)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fade_on_empty = false
    placeholder_text = <i>Şifre...</i>
    position = 0, -40
    halign = center
    valign = center
}
