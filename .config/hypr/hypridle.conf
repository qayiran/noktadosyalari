# ------------------------
# ---- GENËL AYARLAR ----
# ------------------------

general {
    lock_cmd = pidof hyprlock || hyprlock
    on_lock_cmd = sleep 0.3 && $HOME/ilo/idle-ctl.fish dim
    on_unlock_cmd = $HOME/ilo/idle-ctl.fish restore
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = $HOME/ilo/idle-ctl.fish restore
    ignore_dbus_inhibit = true
    ignore_systemd_inhibit = true
    ignore_wayland_inhibit = true
}

# ---------------------------------------------
# ---- KİLİT EKRANI KARARTMA (5 SANİYE) ----
# ---------------------------------------------

listener {
    timeout = 5
    on-timeout = pidof hyprlock >/dev/null && $HOME/ilo/idle-ctl.fish dim
    on-resume = $HOME/ilo/idle-ctl.fish restore
    ignore_inhibit = true
}

# -----------------------------------
# ---- EKRAN KARARTMA (5 DAKİKA) ----
# -----------------------------------

listener {
    timeout = 300
    on-timeout = $HOME/ilo/idle-ctl.fish dim
    on-resume = $HOME/ilo/idle-ctl.fish restore
    condition_cmd = $HOME/ilo/idle-ctl.fish check
    condition_retry = 30
    ignore_inhibit = true
}

# ------------------------------------
# ---- EKRAN KİLİTLEME (10 DAKİKA) ----
# ------------------------------------

listener {
    timeout = 600
    on-timeout = pidof hyprlock >/dev/null || loginctl lock-session
    condition_cmd = $HOME/ilo/idle-ctl.fish check-lock
    condition_retry = 30
    ignore_inhibit = true
}
