# ------------------------
# ---- GENËL AYARLAR ----
# ------------------------

general {
    lock_cmd = pidof hyprlock || hyprlock
    on_lock_cmd = $HOME/ilo/idle-ctl.fish lock-dim
    on_unlock_cmd = $HOME/ilo/idle-ctl.fish unlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = $HOME/ilo/idle-ctl.fish restore
    ignore_dbus_inhibit = true
    ignore_systemd_inhibit = true
    ignore_wayland_inhibit = true
}

# ------------------------------------------------
# ---- AKTİVİTE VE İZLEME TAKİBİ (15 SANİYE) ----
# ------------------------------------------------

listener {
    timeout = 15
    on-timeout = $HOME/ilo/idle-ctl.fish mark-idle
    on-resume = $HOME/ilo/idle-ctl.fish mark-active
    ignore_inhibit = true
}

# ---------------------------------------------
# ---- KİLİT EKRANI KARARTMA (5 SANİYE) ----
# ---------------------------------------------

listener {
    timeout = 5
    on-timeout = $HOME/ilo/idle-ctl.fish dim-lock
    on-resume = $HOME/ilo/idle-ctl.fish restore
    condition_cmd = pidof hyprlock >/dev/null
    ignore_inhibit = true
}

# -----------------------------------
# ---- EKRAN KARARTMA (5 DAKİKA) ----
# -----------------------------------

listener {
    timeout = 300
    on-timeout = $HOME/ilo/idle-ctl.fish dim
    on-resume = $HOME/ilo/idle-ctl.fish restore
    condition_cmd = $HOME/ilo/idle-ctl.fish check
    condition_retry = 10
    ignore_inhibit = true
}

# ------------------------------------
# ---- EKRAN KİLİTLEME (10 DAKİKA) ----
# ------------------------------------

listener {
    timeout = 600
    on-timeout = pidof hyprlock >/dev/null || loginctl lock-session
    condition_cmd = $HOME/ilo/idle-ctl.fish check-lock
    condition_retry = 15
    ignore_inhibit = true
}
